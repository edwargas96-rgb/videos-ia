<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;position:relative;overflow:hidden;background:#000;font-family:"Arial Black",Arial,sans-serif}
.fundo{position:absolute;inset:0;background:url(fundo.png) center/cover}
.sombra{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.45) 26%,rgba(0,0,0,0) 40%,rgba(0,0,0,0) 78%,rgba(0,0,0,.35) 100%)}
.ep{position:absolute;top:300px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#c8231f;color:#fff;font-weight:900;font-size:64px;padding:8px 34px;border-radius:14px;border:6px solid #14110f;letter-spacing:4px}
.titulo{position:absolute;top:400px;left:0;right:0;text-align:center;font-weight:900;font-size:132px;line-height:1;color:#fff;-webkit-text-stroke:16px #14110f;paint-order:stroke fill;letter-spacing:2px}
.titulo span{position:relative;display:inline-block}
.g1,.g2{position:absolute;inset:0;mix-blend-mode:screen;-webkit-text-stroke:0}
.g1{color:#00e5ff;transform:translate(-7px,0);opacity:.75;clip-path:inset(20% 0 55% 0)}
.g2{color:#ff2d7a;transform:translate(7px,0);opacity:.75;clip-path:inset(62% 0 12% 0)}
</style></head><body>
<div class="fundo"></div><div class="sombra"></div>
<div class="ep">EP 1</div>
<div class="titulo"><span>O CELULAR<i class="g1">O CELULAR</i><i class="g2">O CELULAR</i></span></div>
</body></html>
